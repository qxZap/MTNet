<div id="mh-config-ui" style="position: fixed; top: 10px; right: 10px; width: 600px; max-height: 90vh; overflow-y: auto; background: rgba(0,0,0,0.95); border: 2px solid #007bff; border-radius: 8px; padding: 15px; z-index: 10000; font-family: Arial, sans-serif; color: white; display: none;">
    <h3 style="margin-top: 0; color: #007bff;">🔧 MT Net</h3>
    <div style="margin-bottom: 10px;">
        <button id="add-setting" style="background: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">➕ Add Setting</button>
        <button id="reload-config" style="background: #ffc107; color: black; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">🔄 Reload</button>
        <button id="reset-config" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">🔄 Reset to Template</button>
        <button id="save-template" style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">💾 Save Template</button>
        <button id="toggle-ui" style="background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">🙈 Hide</button>
    </div>
    <div style="margin-bottom: 10px;">
        <button id="show-templates" style="background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">📂 Load Template</button>
        <button id="show-merge-templates" style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">🔀 Merge with Template</button>
        <button id="hide-templates" style="background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: none;">❌ Cancel</button>
    </div>
    <div id="templates-list" style="display: none; background: rgba(0,0,0,0.95); border: 1px solid #007bff; border-radius: 4px; padding: 10px; margin-bottom: 10px; max-height: 280px; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>
    <div id="merge-templates-list" style="display: none; background: rgba(0,0,0,0.95); border: 1px solid #28a745; border-radius: 4px; padding: 10px; margin-bottom: 10px; max-height: 280px; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>
    <div id="config-list" style="background: rgba(255,255,255,0.05); border-radius: 4px; padding: 10px; margin-bottom: 10px;"></div>
    <button id="save-config" style="background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; width: 100%;">💾 Save All Changes</button>
</div>

<div id="mh-show-ui-btn" style="position: fixed; top: 10px; right: 10px; width: 40px; height: 40px; background: #007bff; border: 2px solid #007bff; border-radius: 50%; cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
    ⚙️
</div>

<script>
let currentConfig = {};
let allAvailableKeys = [];
let templateOnlyMode = false;

function loadAllConfigKeys() {
    allAvailableKeys = Object.keys(currentConfig);
    return Promise.resolve();
}

function loadConfig() {
    return fetch('/api/get-config', {method: 'GET'})
        .then(response => response.json())
        .then(data => {
            if (!templateOnlyMode) {
                currentConfig = data.configs || {};
                allAvailableKeys = Object.keys(currentConfig);
            }
            if (!templateOnlyMode) {
                renderConfigUI();
            }
        })
        .catch(err => console.error('Failed to load config:', err));
}

function renderConfigUI() {
    const container = document.getElementById('config-list');
    container.innerHTML = '';

    const allKeys = [...new Set([...allAvailableKeys, ...Object.keys(currentConfig)])];

    allKeys.sort().forEach(key => {
        const div = document.createElement('div');
        div.style.marginBottom = '8px';
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        div.style.gap = '5px';

        const label = document.createElement('label');
        label.textContent = key;
        label.style.flex = '1.5';
        label.style.fontSize = '12px';
        label.style.color = 'white';
        label.style.fontWeight = 'bold';
        label.style.wordBreak = 'break-all';
        label.style.whiteSpace = 'normal';

        let input;
        if (typeof currentConfig[key] === 'number' || !isNaN(parseFloat(currentConfig[key]))) {
            input = document.createElement('input');
            input.type = 'number';
            input.step = '0.1';
        } else {
            input = document.createElement('input');
            input.type = 'text';
        }

        input.value = currentConfig[key] !== undefined ? currentConfig[key] : '';
        input.dataset.key = key;
        input.style.flex = '1.5';
        input.style.padding = '4px 8px';
        input.style.background = 'rgba(255,255,255,0.1)';
        input.style.border = '1px solid #555';
        input.style.borderRadius = '3px';
        input.style.color = 'white';
        input.placeholder = 'Enter value...';

        input.addEventListener('change', function() {
            const value = this.type === 'number' ? parseFloat(this.value) : this.value;
            if (this.value === '') {
                delete currentConfig[this.dataset.key];
            } else {
                currentConfig[this.dataset.key] = value;
            }
        });

        const removeBtn = document.createElement('button');
        removeBtn.textContent = '❌';
        removeBtn.style.background = 'transparent';
        removeBtn.style.border = 'none';
        removeBtn.style.color = '#ff6b6b';
        removeBtn.style.cursor = 'pointer';
        removeBtn.style.padding = '2px';
        removeBtn.title = 'Remove this setting';

        removeBtn.addEventListener('click', function() {
            if (confirm(`Remove "${key}" from config?`)) {
                delete currentConfig[key];
                renderConfigUI();
            }
        });

        div.appendChild(label);
        div.appendChild(input);
        div.appendChild(removeBtn);
        container.appendChild(div);
    });
}

function addNewSetting() {
    const key = prompt('Enter new config key (e.g., mh.vehicleTopSpeed or any cvar):');
    if (key && key.trim()) {
        const trimmedKey = key.trim();
        if (!currentConfig.hasOwnProperty(trimmedKey)) {
            currentConfig[trimmedKey] = '';
            allAvailableKeys.push(trimmedKey);
            renderConfigUI();

            setTimeout(() => {
                const inputs = document.querySelectorAll(`input[data-key="${trimmedKey}"]`);
                if (inputs.length > 0) {
                    inputs[0].focus();
                }
            }, 100);
        } else {
            alert('This setting already exists!');
        }
    }
}

document.getElementById('add-setting').addEventListener('click', addNewSetting);

document.getElementById('save-config').addEventListener('click', function() {
    fetch('/api/save-config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({configs: currentConfig})
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message || 'Configuration saved successfully!');
    })
    .catch(err => alert('Failed to save config: ' + err));
});

document.getElementById('reload-config').addEventListener('click', function() {
    if (templateOnlyMode) {
        renderConfigUI();
    } else {
        Promise.all([loadAllConfigKeys(), loadConfig()]).then(() => {
            renderConfigUI();
        });
    }
});

document.getElementById('reset-config').addEventListener('click', function() {
    if (confirm('Reset all config values to template defaults? This will clear your custom changes.')) {
        fetch('/api/reset-config', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message || 'Configuration reset to template values.');
            templateOnlyMode = false;
            Promise.all([loadAllConfigKeys(), loadConfig()]).then(() => {
                renderConfigUI();
            });
        })
        .catch(err => alert('Failed to reset config: ' + err));
    }
});

document.getElementById('save-template').addEventListener('click', function() {
    const templateName = prompt('Enter template filename (e.g., racing_setup):');
    if (templateName && templateName.trim()) {
        const templateTitle = prompt('Enter template title (display name):');
        if (templateTitle && templateTitle.trim()) {
            const description = prompt('Enter template description (optional):') || '';
            const author = prompt('Enter author name (optional):') || '';
            fetch('/api/save-template', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: templateName.trim(),
                    title: templateTitle.trim(),
                    description: description.trim(),
                    author: author.trim()
                })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message || 'Template saved successfully!');
            })
            .catch(err => alert('Failed to save template: ' + err));
        }
    }
});

document.getElementById('show-templates').addEventListener('click', function() {
    const templatesList = document.getElementById('templates-list');
    const mergeTemplatesList = document.getElementById('merge-templates-list');
    const showBtn = document.getElementById('show-templates');
    const showMergeBtn = document.getElementById('show-merge-templates');
    const hideBtn = document.getElementById('hide-templates');

    if (templatesList.style.display === 'none') {
        loadTemplates();
        templatesList.style.display = 'block';
        mergeTemplatesList.style.display = 'none';
        showBtn.style.display = 'none';
        showMergeBtn.style.display = 'none';
        hideBtn.style.display = 'inline-block';
    }
});

document.getElementById('show-merge-templates').addEventListener('click', function() {
    const templatesList = document.getElementById('templates-list');
    const mergeTemplatesList = document.getElementById('merge-templates-list');
    const showBtn = document.getElementById('show-templates');
    const showMergeBtn = document.getElementById('show-merge-templates');
    const hideBtn = document.getElementById('hide-templates');

    if (mergeTemplatesList.style.display === 'none') {
        loadMergeTemplates();
        mergeTemplatesList.style.display = 'block';
        templatesList.style.display = 'none';
        showBtn.style.display = 'none';
        showMergeBtn.style.display = 'none';
        hideBtn.style.display = 'inline-block';
    }
});

document.getElementById('hide-templates').addEventListener('click', function() {
    const templatesList = document.getElementById('templates-list');
    const mergeTemplatesList = document.getElementById('merge-templates-list');
    const showBtn = document.getElementById('show-templates');
    const showMergeBtn = document.getElementById('show-merge-templates');
    const hideBtn = document.getElementById('hide-templates');

    templatesList.style.display = 'none';
    mergeTemplatesList.style.display = 'none';
    showBtn.style.display = 'inline-block';
    showMergeBtn.style.display = 'inline-block';
    hideBtn.style.display = 'none';
});

function loadTemplate(templateName, templateTitle) {
    if (confirm(`Load template "${templateTitle}"? This will replace your current configuration.`)) {
        fetch('/api/load-template', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: templateName})
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'loaded') {
                currentConfig = data.configs || {};
                allAvailableKeys = Object.keys(currentConfig);
                templateOnlyMode = true;

                alert(data.message || 'Template loaded successfully!');
                document.getElementById('templates-list').style.display = 'none';
                document.getElementById('show-templates').style.display = 'inline-block';
                document.getElementById('hide-templates').style.display = 'none';
                renderConfigUI();
            } else {
                alert('Failed to load template: ' + data.message);
            }
        })
        .catch(err => alert('Failed to load template: ' + err));
    }
}

function mergeTemplate(templateName, templateTitle) {
    if (confirm(`Merge with template "${templateTitle}"? This will add/update your current configuration with template values.`)) {
        fetch('/api/load-template', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: templateName})
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'loaded') {
                const templateConfigs = data.configs || {};
                const mergedConfig = {...currentConfig};

                for (const [key, value] of Object.entries(templateConfigs)) {
                    mergedConfig[key] = value;
                }

                currentConfig = mergedConfig;
                allAvailableKeys = Object.keys(currentConfig);
                templateOnlyMode = false;

                alert(`Successfully merged ${Object.keys(templateConfigs).length} settings from "${templateTitle}"!`);
                document.getElementById('merge-templates-list').style.display = 'none';
                document.getElementById('show-templates').style.display = 'inline-block';
                document.getElementById('show-merge-templates').style.display = 'inline-block';
                document.getElementById('hide-templates').style.display = 'none';
                renderConfigUI();
            } else {
                alert('Failed to load template for merge: ' + data.message);
            }
        })
        .catch(err => alert('Failed to merge template: ' + err));
    }
}

function loadTemplates() {
    fetch('/api/list-templates')
        .then(response => response.json())
        .then(data => {
            const templatesList = document.getElementById('templates-list');
            templatesList.innerHTML = '';

            if (data.templates && data.templates.length > 0) {
                data.templates.forEach(template => {
                    const templateDiv = document.createElement('div');
                    templateDiv.style.cssText = `
                        background: rgba(255,255,255,0.05);
                        border: 1px solid #555;
                        border-radius: 4px;
                        padding: 8px;
                        margin-bottom: 5px;
                        cursor: pointer;
                        color: white;
                        transition: background-color 0.2s;
                    `;

                    const titleDiv = document.createElement('div');
                    titleDiv.style.fontWeight = 'bold';
                    titleDiv.style.marginBottom = '2px';

                    let titleText = template.title;
                    if (template.author) {
                        titleText += ` by <strong>${template.author}</strong>`;
                    }
                    titleDiv.innerHTML = titleText;

                    const infoDiv = document.createElement('div');
                    infoDiv.style.fontSize = '11px';
                    infoDiv.style.color = '#ccc';
                    infoDiv.textContent = `${template.variables} variables`;

                    if (template.description) {
                        const descDiv = document.createElement('div');
                        descDiv.style.fontSize = '11px';
                        descDiv.style.color = '#aaa';
                        descDiv.style.marginTop = '2px';
                        descDiv.textContent = template.description;
                        templateDiv.appendChild(descDiv);
                    }

                    if (template.created) {
                        const dateDiv = document.createElement('div');
                        dateDiv.style.fontSize = '10px';
                        dateDiv.style.color = '#888';
                        dateDiv.style.marginTop = '1px';
                        dateDiv.textContent = `Created: ${new Date(template.created).toLocaleDateString()}`;
                        infoDiv.appendChild(dateDiv);
                    }

                    templateDiv.appendChild(titleDiv);
                    templateDiv.appendChild(infoDiv);

                    templateDiv.addEventListener('mouseenter', function() {
                        this.style.background = 'rgba(0,123,255,0.2)';
                    });

                    templateDiv.addEventListener('mouseleave', function() {
                        this.style.background = 'rgba(255,255,255,0.05)';
                    });

                    templateDiv.addEventListener('click', function() {
                        loadTemplate(template.name, template.title);
                    });

                    templatesList.appendChild(templateDiv);
                });
            } else {
                const noTemplatesDiv = document.createElement('div');
                noTemplatesDiv.style.cssText = `
                    color: #888;
                    text-align: center;
                    padding: 20px;
                    font-style: italic;
                `;
                noTemplatesDiv.textContent = 'No templates found. Save some configurations first!';
                templatesList.appendChild(noTemplatesDiv);
            }
        })
        .catch(err => {
            console.error('Failed to load templates:', err);
            const templatesList = document.getElementById('templates-list');
            templatesList.innerHTML = '<div style="color: #ff6b6b; text-align: center; padding: 20px;">Failed to load templates</div>';
        });
}

function loadMergeTemplates() {
    fetch('/api/list-templates')
        .then(response => response.json())
        .then(data => {
            const mergeTemplatesList = document.getElementById('merge-templates-list');
            mergeTemplatesList.innerHTML = '';

            if (data.templates && data.templates.length > 0) {
                data.templates.forEach(template => {
                    const templateDiv = document.createElement('div');
                    templateDiv.style.cssText = `
                        background: rgba(255,255,255,0.05);
                        border: 1px solid #555;
                        border-radius: 4px;
                        padding: 8px;
                        margin-bottom: 5px;
                        cursor: pointer;
                        color: white;
                        transition: background-color 0.2s;
                    `;

                    const titleDiv = document.createElement('div');
                    titleDiv.style.fontWeight = 'bold';
                    titleDiv.style.marginBottom = '2px';

                    let titleText = template.title;
                    if (template.author) {
                        titleText += ` by <strong>${template.author}</strong>`;
                    }
                    titleDiv.innerHTML = titleText;

                    const infoDiv = document.createElement('div');
                    infoDiv.style.fontSize = '11px';
                    infoDiv.style.color = '#ccc';
                    infoDiv.textContent = `${template.variables} variables`;

                    if (template.description) {
                        const descDiv = document.createElement('div');
                        descDiv.style.fontSize = '11px';
                        descDiv.style.color = '#aaa';
                        descDiv.style.marginTop = '2px';
                        descDiv.textContent = template.description;
                        templateDiv.appendChild(descDiv);
                    }

                    if (template.created) {
                        const dateDiv = document.createElement('div');
                        dateDiv.style.fontSize = '10px';
                        dateDiv.style.color = '#888';
                        dateDiv.style.marginTop = '1px';
                        dateDiv.textContent = `Created: ${new Date(template.created).toLocaleDateString()}`;
                        infoDiv.appendChild(dateDiv);
                    }

                    templateDiv.appendChild(titleDiv);
                    templateDiv.appendChild(infoDiv);

                    templateDiv.addEventListener('mouseenter', function() {
                        this.style.background = 'rgba(40,167,69,0.2)';
                    });

                    templateDiv.addEventListener('mouseleave', function() {
                        this.style.background = 'rgba(255,255,255,0.05)';
                    });

                    templateDiv.addEventListener('click', function() {
                        mergeTemplate(template.name, template.title);
                    });

                    mergeTemplatesList.appendChild(templateDiv);
                });
            } else {
                const noTemplatesDiv = document.createElement('div');
                noTemplatesDiv.style.cssText = `
                    color: #888;
                    text-align: center;
                    padding: 20px;
                    font-style: italic;
                `;
                noTemplatesDiv.textContent = 'No templates found. Save some configurations first!';
                mergeTemplatesList.appendChild(noTemplatesDiv);
            }
        })
        .catch(err => {
            console.error('Failed to load merge templates:', err);
            const mergeTemplatesList = document.getElementById('merge-templates-list');
            mergeTemplatesList.innerHTML = '<div style="color: #ff6b6b; text-align: center; padding: 20px;">Failed to load templates</div>';
        });
}

document.getElementById('toggle-ui').addEventListener('click', function() {
    hideMainUI();
});

document.getElementById('mh-show-ui-btn').addEventListener('click', function() {
    showMainUI();
});

function hideMainUI() {
    const mainUI = document.getElementById('mh-config-ui');
    const showBtn = document.getElementById('mh-show-ui-btn');

    mainUI.style.display = 'none';
    showBtn.style.display = 'flex';
}

function showMainUI() {
    const mainUI = document.getElementById('mh-config-ui');
    const showBtn = document.getElementById('mh-show-ui-btn');

    mainUI.style.display = 'block';
    showBtn.style.display = 'none';
}

// Load config on page load
Promise.all([loadAllConfigKeys(), loadConfig()]).then(() => {
    renderConfigUI();
});
</script>
